spring.application.name=rachao-esportes

#Config da conexão com H2
#Indica onde encontramos o BD
spring.datasource.url=jdbc:h2:mem:rachaodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

#Selecionando o Driver de conexão
spring.datasource.driverClassName=org.h2.Driver

#Usuario e senha de acesso ao db
spring.datasource.username=adm
spring.datasource.password=rachao

#Config do Hibernate - JPA gerencia o hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#Nivel de permissão do hibernate para interagir com o BD
spring.jpa.hibernate.ddl-auto=create-drop

#Mostrar as requisições no console da IDE do backend
spring.jpa.show-sql=true

#Habilitar o console
spring.h2.console.enabled=true

#caminho para acessar o console do h2
spring.h2.console.path=/bd-racha
